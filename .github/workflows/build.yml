name: Build plugin artifacts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Windows (VST3 + Standalone)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $vst3 = "build\HumHouseVocalTune_artefacts\Release\VST3\SkellyTune.vst3"
          if (-not (Test-Path $vst3)) { throw "SkellyTune VST3 bundle missing: $vst3" }
          Compress-Archive -Path $vst3 -DestinationPath "artifacts\SkellyTune-Windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTune-Windows-x64
          path: artifacts/*
          retention-days: 7

      # ---------- Release assets ----------
      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
