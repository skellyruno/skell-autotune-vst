name: Windows VST3 release package

on:
  push:
    branches: [main, master, devin/1778052783-initial-plugin]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: skellytune-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master' && github.event.pull_request.head.ref != 'production' && !startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.base.ref != 'production' && !startsWith(github.event.pull_request.base.ref, 'release/') }}

jobs:
  dsp-regression:
    name: Offline DSP regression (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v6
      - name: Configure offline DSP regressions
        run: cmake -S . -B build-dsp -DSKELLYTUNE_DSP_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build offline DSP regression executables
        run: cmake --build build-dsp --config Release --parallel 6
      - name: Run offline DSP regressions
        run: ctest --test-dir build-dsp -C Release --output-on-failure --parallel 6

      - name: Report actual formant direction and fundamental invariance
        run: ctest --test-dir build-dsp -C Release -V -R formant_direction_regression

      # These synthetic callback timings are machine-dependent diagnostics,
      # not audio quality or FL Studio CPU measurements. Do not gate releases
      # on hard percentage thresholds from shared hosted runners.
      - name: Record synthetic callback duty and p99 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/cpu
          csv=reports/cpu/synthetic-callback-2026-11-22.csv
          echo "rate,block,low,formants,range,source_hz,latency,duty,p99_seconds,max_seconds,p99_deadline_fraction,max_deadline_fraction,late_callbacks,callbacks,peak,pitch_motion" > "$csv"
          for config in \
              "44100 127 0 0 2 3 1" \
              "48000 128 0 0 2 3 1" \
              "48000 128 1 0 2 3 1" \
              "48000 128 0 1 2 3 1" \
              "48000 128 1 1 2 3 1" \
              "96000 512 1 0 2 3 1"; do
            read -r rate block low formants range seconds pitchMotion <<< "$config"
            ./build-dsp/realtime_stress_benchmark "$rate" "$block" "$low" "$formants" "$range" "$seconds" "$pitchMotion" | tail -n 1 >> "$csv"
          done
          cat "$csv"

      - name: Upload synthetic CPU measurement CSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTune-synthetic-callback-cpu
          path: reports/cpu/*.csv
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test release packaging and workflow contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Require owner-approved identity before public release assets
        if: github.event_name == 'release'
        run: python scripts/package_vst3.py --identity release/identity.json --check-release-approval

      - name: Configure Windows x64
        run: cmake -S . -B build -A x64

      - name: Build VST3 target only
        run: cmake --build build --config Release --target HumHouseVocalTune_VST3 --parallel 2

      - name: Render genuine JUCE UI and verify retune knob direction
        shell: pwsh
        run: |
          cmake --build build --config Release --target skellytune_editor_smoke --parallel 2
          & "build/Release/skellytune_editor_smoke.exe" "reports/ui"

      - name: Upload real editor screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTune-editor-screenshots
          path: reports/ui/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Validate VST3 with pluginval strictness 5
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: |
            build/HumHouseVocalTune_artefacts/Release/VST3/SkellyTune.vst3
          strictness-level: 5
          args: --skip-gui-tests
          report-dir: reports/pluginval
          pluginval-version: v2.0.0-beta3

      - name: Upload pluginval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTune-pluginval-report
          path: reports/pluginval/
          if-no-files-found: warn
          retention-days: 30

      - name: Normalize metadata and create verified VST3 preview ZIP
        shell: pwsh
        run: >-
          python scripts/package_vst3.py
          --identity release/identity.json
          --cmake CMakeLists.txt
          --bundle build/HumHouseVocalTune_artefacts/Release/VST3/SkellyTune.vst3
          --output artifacts/SkellyTune-Windows-x64.zip

      # Owner requested downloadable engineering test build for PR #10.
      # Unrelated public PRs/forks remain blocked; releases need approval.
      - name: Upload verified Windows VST3 preview
        if: github.repository_visibility == 'private' || github.event_name == 'release' || (github.event_name == 'pull_request' && github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/skellytune-og-trusted-motion-20261122')
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTune-Windows-VST3
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach owner-approved release assets
    if: github.event_name == 'release'
    needs: [build, dsp-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkellyTune-Windows-VST3
          path: artifacts

      - name: Attach VST3 ZIP and SHA-256 sidecar
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
