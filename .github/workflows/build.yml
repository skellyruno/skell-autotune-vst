name: Build plugin artifacts

on:
  push:
    branches: [main, master, codex/skellytune-low-latency]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Windows (VST3 + Standalone)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Configure low-latency regressions
        run: cmake -S . -B build-dsp -DSKELLYTUNE_LOW_LATENCY_TESTS_ONLY=ON

      - name: Build low-latency regressions
        run: cmake --build build-dsp --config Release --parallel 3

      - name: Test low-latency processing
        run: ctest --test-dir build-dsp -C Release --output-on-failure

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install full-plugin test host
        run: python -m pip install --disable-pip-version-check pedalboard==0.9.26 numpy==2.2.6

      - name: Test VST3 automation and saved sessions
        run: python tests/plugin_host_smoke.py build/HumHouseVocalTune_artefacts/Release/VST3/SkellyTune.vst3

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $vst3 = "build\HumHouseVocalTune_artefacts\Release\VST3\SkellyTune.vst3"
          Compress-Archive -Path $vst3 -DestinationPath "artifacts\SkellyTune-Windows-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkellyTune-Windows-x64
          path: artifacts/*

      # ---------- Release assets ----------
      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
